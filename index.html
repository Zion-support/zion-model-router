<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Model Router Configurator</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input[type=range]{width:100%}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap;font-family:monospace}</style></head><body><h1>🔀 Model Router Configurator</h1><p>Set your priorities, get routing rules.</p><label>Cost priority: <input type="range" id="c" min="0" max="100" value="60"></label><label>Latency priority: <input type="range" id="l" min="0" max="100" value="50"></label><label>Quality priority: <input type="range" id="q" min="0" max="100" value="70"></label><button onclick="go()">Generate config</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const c=g('c'),l=g('l'),q=g('q');const fast=c>50||l>60,smart=q>60;document.getElementById('out').textContent=`routing_rules:\n  default: ${smart&&!fast?'frontier-model':'balanced-model'}\n  simple_queries: small-fast-model  # ${c}% cost weight\n  complex_reasoning: frontier-model\n  latency_budget_ms: ${2000-l*15}\n  fallback_chain: [primary, secondary, local]\n  monthly_budget_alerts: true\n\nProduction LLM gateway with these rules: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-model-router">GitHub</a> · <a href="https://ziontechgroup.com/llm-gateway/">LLM Gateway</a></p></body></html>
