<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Model Router Configurator</title>
<meta name="description" content="Set cost/latency/quality priorities and traffic mix; get routing rules and config JSON for your AI gateway. Free tool by Zion Tech Group.">
<style>
:root{--bg:#0b0e0a;--card:#151b12;--acc:#86efac;--txt:#eaf5e6;--mut:#9cb893}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#14331c,#0b0e0a)}
h1{margin:0 0 8px}.wrap{max-width:960px;margin:0 auto;padding:24px}
.panel{background:var(--card);border:1px solid #24381c;border-radius:14px;padding:20px;margin-bottom:20px}
label{display:block;font-size:.85rem;color:var(--mut);margin:14px 0 4px}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}@media(max-width:700px){.row{grid-template-columns:1fr}}
.tier{background:#10180d;border:1px solid #24381c;border-radius:12px;padding:14px}
.tier h4{margin:0 0 8px;color:var(--acc)}
pre{background:#0d130a;border:1px solid #24381c;border-radius:12px;padding:16px;font-size:.82rem;overflow:auto}
button{margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#0d1f10;font-weight:700;cursor:pointer}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #1c2b16;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🚦 Zion Model Router Configurator</h1>
<p>Define your priorities and traffic mix — get a three-tier routing strategy plus gateway-ready JSON.</p></header>
<div class="wrap">
<div class="panel">
<label>Priority — Cost <span id="vc">5</span></label><input type="range" id="cost" min="1" max="10" value="5">
<label>Priority — Latency <span id="vl">5</span></label><input type="range" id="lat" min="1" max="10" value="5">
<label>Priority — Quality <span id="vq">5</span></label><input type="range" id="qual" min="1" max="10" value="5">
<label>Share of simple requests (%) — FAQs, formatting, short answers</label><input type="range" id="simple" min="0" max="100" value="60">
<label>Share of complex requests (%) — long reasoning, code, analysis</label><input type="range" id="complex" min="0" max="40" value="10">
<button onclick="gen()">Generate routing config</button>
</div>
<div class="panel" id="result" style="display:none"><div class="row" id="tiers"></div><pre id="json"></pre></div>
</div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-llm-cost-calculator/">LLM Cost Calculator</a>
<a href="https://ziontechgroup.com/zion-context-window-planner/">Context Planner</a>
<a href="https://ziontechgroup.com/ai-gateway/">Zion AI Gateway</a></footer>
<script>
function gen(){
const c=+document.getElementById('cost').value,l=+document.getElementById('lat').value,q=+document.getElementById('qual').value;
const simple=+document.getElementById('simple').value,complex=+document.getElementById('complex').value,mid=Math.max(0,100-simple-complex);
const cheap=c>=l&&c>=q?'Gemini 2.5 Flash-Lite / GPT-5 nano':'Gemini 2.5 Flash';
const midm=q>c?'Claude Sonnet 4.5':'GPT-5 mini';
const top=q>=7?'Claude Opus 4.5':'GPT-5.1';
const tiers=[['Simple ('+simple+'%)',cheap,'classify: short input, FAQ intent, no tools'],['Standard ('+mid+'%)',midm,'default tier'],['Complex ('+complex+'%)',top,'long context, code, multi-step reasoning, escalation keywords']];
document.getElementById('tiers').innerHTML=tiers.map(([n,m,r])=>`<div class="tier"><h4>${n}</h4><div><b>${m}</b></div><small style="color:var(--mut)">Route when: ${r}</small></div>`).join('');
const cfg={router:{tiers:[{name:'simple',model:cheap,match:'input_tokens<2000 && intent in [faq,formatting] && tools==[]',weight:simple},{name:'standard',model:midm,match:'default',weight:mid},{name:'complex',model:top,match:'input_tokens>8000 || has_tools || intent in [code,analysis]',weight:complex}],fallbacks:{simple:'standard',standard:'complex'},cache:{enabled:c>=6,ttl_seconds:3600},priorities:{cost:c,latency:l,quality:q}}};
document.getElementById('json').textContent=JSON.stringify(cfg,null,2);
document.getElementById('result').style.display='block';}
</script>
</body>
</html>
